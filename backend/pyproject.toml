[project]
name = "aios"
version = "0.1.0"
description = "AI OS: sales team-lead clone and CRM Copilot for real estate brokerages."
requires-python = ">=3.12,<3.14"
dependencies = [
    "alembic>=1.13",
    "fastapi>=0.115",
    "google-genai>=1.0",
    "httpx>=0.27",
    "openpyxl>=3.1",
    "pgvector>=0.3",
    "psycopg[binary]>=3.2",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "sqlalchemy[asyncio]>=2.0",
    "uvicorn[standard]>=0.32",
]

[project.scripts]
aios = "aios.entrypoints.cli:main"

[dependency-groups]
dev = [
    "httpx>=0.27",
    "httpx2>=2.16.0",
    "mypy>=1.13",
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-cov>=6.0",
    "ruff>=0.8",
    "types-openpyxl>=3.1.5.20261017",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/aios"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests", "tools"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "N", "SIM", "RUF", "PT", "ANN", "S", "DTZ"]
# RUF001-003: Arabic letters are flagged as "confusable" with Latin; this codebase is bilingual.
ignore = ["ANN401", "RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "ANN", "E501"]
"tools/**" = ["S101", "S311", "E501"]  # seeded demo-data generator with prose templates

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
mypy_path = "src:tools"
files = ["src/aios", "tools"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers --import-mode=importlib"
pythonpath = ["src", "tools"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
markers = ["db: needs a PostgreSQL+pgvector database (AIOS_TEST_DATABASE_URL)"]
